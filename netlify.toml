[build]
  # Safe for Git-connected Netlify builds; manual CLI deployments still supply --dir dist.
  command = "npm ci --no-audit --no-fund && npm --prefix api ci --no-audit --no-fund && npm test"
  publish = "dist"
  functions = "netlify/functions"

# Every public SEO URL is pre-rendered as a real file. Unknown routes\n# must return a true 404 instead of a soft-404 SPA homepage.
# Owner-approved Botanical Kava homepage. Force this exact root path over
# the legacy index.html only; all inner routes keep their existing SPA pages.
[[redirects]]
  from = "/"
  to = "/botanical-home.html"
  status = 200
  force = true

# Hidden owner dashboard; server-side authentication protects its data.
[[redirects]]
  from = "/insights"
  to = "/insights.html"
  status = 200
  force = false

# Separate owner-only bookings and promotions workspace.
[[redirects]]
  from = "/studio"
  to = "/tribal-studio.html"
  status = 200
  force = false

# Make Private Events the actual standalone venue page, never the old SPA
# lounge-rental section. Keep /events/venue as a compatible legacy entry.
[[redirects]]
  from = "/private-events"
  to = "/venue-rental.html"
  status = 200
  force = true

[[redirects]]
  from = "/private-events/"
  to = "/venue-rental.html"
  status = 200
  force = true

# High-converting, same-domain venue landing page.
[[redirects]]
  from = "/events/venue"
  to = "/venue-rental.html"
  status = 200
  force = false

[[redirects]]
  from = "/events/venue/"
  to = "/venue-rental.html"
  status = 200
  force = false

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = false
