[build]
  publish = "."

# Let real files (robots.txt, sitemap.xml, images, css, js) serve first;
# SPA path routes fall through to index.html for clean SEO URLs.
# Owner-approved Botanical Kava homepage. Force this exact root path over
# the legacy index.html only; all inner routes keep their existing SPA pages.
[[redirects]]
  from = "/"
  to = "/botanical-home.html"
  status = 200
  force = true

# Hidden owner dashboard; server-side authentication protects its data.
[[redirects]]
  from = "/insights"
  to = "/insights.html"
  status = 200
  force = false

# Separate owner-only bookings and promotions workspace.
[[redirects]]
  from = "/studio"
  to = "/tribal-studio.html"
  status = 200
  force = false

# High-converting, same-domain venue landing page.
[[redirects]]
  from = "/events/venue"
  to = "/venue-rental.html"
  status = 200
  force = false

[[redirects]]
  from = "/events/venue/"
  to = "/venue-rental.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = false
