[build]
  publish = "."

# Let real files (robots.txt, sitemap.xml, images, css, js) serve first;
# SPA path routes fall through to index.html for clean SEO URLs.
# Hidden owner dashboard; server-side authentication protects its data.
[[redirects]]
  from = "/insights"
  to = "/insights.html"
  status = 200
  force = false

# High-converting, same-domain venue landing page.
[[redirects]]
  from = "/events/venue"
  to = "/venue-rental.html"
  status = 200
  force = false

[[redirects]]
  from = "/events/venue/"
  to = "/venue-rental.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = false
