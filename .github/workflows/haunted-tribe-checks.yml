name: Haunted Tribe checks
on:
  pull_request:
    paths:
      - 'haunted-tribe/**'
      - 'api/**'
      - 'index.html'
      - 'styles.css'
      - 'staticwebapp.config.json'
      - 'scripts/**'
      - '.github/workflows/haunted-tribe-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix api
      - run: npm test
      - name: Check preview deployment availability
        id: preview
        env:
          DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Preview deployment unavailable: existing Azure deployment secret is missing." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy isolated event review environment
        if: steps.preview.outputs.available == 'true'
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          output_location: ''
          api_location: api
          deployment_environment: haunted-review
      - name: Record preview URL
        if: steps.preview.outputs.available == 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: echo "Haunted Tribe preview — $PREVIEW_URL/haunted-tribe" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: haunted-tribe-site-preview
          path: dist/
