name: Manual Kava Draft Fallback

on:
  # Scheduling stays in the existing Azure Container Apps job.
  # Successful manual runs also trigger Publish Passing Kava Drafts.
  workflow_dispatch:

concurrency:
  group: daily-kava-production
  cancel-in-progress: false

jobs:
  auto-publish:
    if: github.repository == 'JD-Vane-Ai-Dev/tribal-kava-lounge' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Run daily engine (fetch + draft + check)
        run: |
          cd daily-engine
          python3 run_daily.py run
          
      - name: Commit draft changes
        run: |
          git config user.name "fckaemail-cyber"
          git config user.email "f.ckaemail@gmail.com"
          git add daily-engine/state/
          git add daily-engine/drafts/
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily draft $(date +%Y-%m-%d) - ready for automatic content checks"
            git show -s --format='%an <%ae>' HEAD
            git push origin HEAD:master
          fi
          
      - name: Summary
        run: |
          {
            echo "## Manual Kava Draft Created"
            echo "- Time: $(date -u)"
            echo "- Status: Draft pipeline completed"
            echo "- Next: Publish Passing Kava Drafts will recheck current content, publish passing posts, and hold flagged drafts for review"
          } >> "$GITHUB_STEP_SUMMARY"
