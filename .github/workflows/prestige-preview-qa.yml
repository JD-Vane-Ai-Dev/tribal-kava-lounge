name: Prestige isolated preview QA
on:
  push:
    branches:
      - prestige/tribal-botanical-pilot-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: |
          npm ci
          npm --prefix api ci
      - name: Full existing test suite
        run: npm test
      - name: Create separate review-only build
        run: npm run build:prestige-preview
      - name: Verify isolation and preview indexing controls
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, stat } from 'node:fs/promises';
          import path from 'node:path';
          const production = 'dist';
          const preview = 'dist-prestige-preview';
          const collect = async (dir) => {
            const out = [];
            for (const ent of await readdir(dir, { withFileTypes: true })) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) out.push(...await collect(p));
              else if (ent.name.endsWith('.html')) out.push(p);
            }
            return out;
          };
          const files = await collect(preview);
          if (files.length < 20) throw Error('Preview lost expected HTML routes');
          for (const file of files) {
            const html = await readFile(file, 'utf8');
            if (!/<meta name="robots" content="noindex,nofollow,noarchive">/.test(html))
              throw Error('Preview is missing robots policy: ' + file);
          }
          const headers = await readFile(path.join(preview, '_headers'), 'utf8');
          if (!headers.includes('X-Robots-Tag: noindex, nofollow, noarchive'))
            throw Error('Missing preview HTTP robots header');
          const sourceHome = await readFile(path.join(production, 'botanical-home.html'), 'utf8');
          if (sourceHome.includes('name="robots" content="noindex,nofollow,noarchive"'))
            throw Error('Preview exclusion leaked into production output');
          const previewHome = await readFile(path.join(preview, 'botanical-home.html'), 'utf8');
          if (!previewHome.includes('noindex,nofollow,noarchive'))
            throw Error('Preview homepage not protected');
          console.log(JSON.stringify({ok:true,htmlCount:files.length,previewNoindex:true,productionBuildUnaffected:true}));
          NODE


      - name: Deploy the isolated preview project (never Tribal production)
        if: github.repository == 'JD-Vane-Ai-Dev/tribal-kava-lounge' && github.ref == 'refs/heads/prestige/tribal-botanical-pilot-20261116'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$NETLIFY_AUTH_TOKEN" ]]; then
            echo "::error::Existing NETLIFY_AUTH_TOKEN repository secret not available; cannot update preview."
            exit 1
          fi
          # Stage outside the repo so the original production netlify.toml and
          # production Netlify Functions can never be included in this deploy.
          stage="$(mktemp -d)"
          cp -a dist-prestige-preview/. "$stage/"
          printf '%s\n' '[build]' '  publish = "."' '  command = "echo staging-only"'             '' '[[redirects]]' '  from = "/"' '  to = "/botanical-home.html"'             '  status = 200' '  force = true'             '' '[[redirects]]' '  from = "/private-events"' '  to = "/venue-rental.html"'             '  status = 200' '  force = true' > "$stage/netlify.toml"
          test ! -d "$stage/netlify/functions"
          test -f "$stage/_headers"
          test -f "$stage/botanical-home.html"
          grep -q 'mobile-utility-nav' "$stage/botanical-home.html"
          npm install --global netlify-cli@26.1.0 --no-audit --no-fund
          cd "$stage"
          netlify deploy --prod --no-build --dir .             --site 9efee41a-f76e-4754-9435-5ea0bc2c0977             --message "Prestige review branch GitHub QA $GITHUB_SHA"             --json > "$RUNNER_TEMP/prestige-netlify-deploy.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/prestige-netlify-deploy.json') as f:
              result = json.load(f)
          if not result.get('deploy_id'):
              raise SystemExit('Netlify did not confirm preview deployment')
          print('Prestige preview deploy ID:', result['deploy_id'])
          print('Isolated preview:', 'https://tribal-prestige-preview-20261116.netlify.app/')
          PY

      - name: Verify public staging URL and navigation
        if: github.repository == 'JD-Vane-Ai-Dev/tribal-kava-lounge' && github.ref == 'refs/heads/prestige/tribal-botanical-pilot-20261116'
        run: |
          set -euo pipefail
          base='https://tribal-prestige-preview-20261116.netlify.app'
          ready=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 12 "$base/" > "$RUNNER_TEMP/prestige-home.html" &&
               grep -q 'mobile-utility-nav' "$RUNNER_TEMP/prestige-home.html" &&
               grep -q 'skip-to-main' "$RUNNER_TEMP/prestige-home.html"; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" -eq 1
          curl -fsSI --max-time 12 "$base/" | grep -iq 'x-robots-tag:.*noindex'
          curl -fsS --max-time 12 "$base/menu/" > /dev/null
          curl -fsS --max-time 12 "$base/new-here/" > /dev/null
          echo 'Verified preview, noindex headers, menu, first-visit and mobile actions.'
